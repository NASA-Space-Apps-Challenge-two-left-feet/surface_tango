# Curated landslide-risk source corpus for the GraphRAG conceptual grounding.
# Public official documents only (SGC methodology + Medellin POT detailed-risk resolutions),
# cited by resolution number. The documents themselves are NOT committed (they live outside
# the repo); only the derived index (git-ignored) and the citations here are kept.
#
# `aoi` marks a document that defines/prioritizes a Valle de Aburra landslide polygon.

