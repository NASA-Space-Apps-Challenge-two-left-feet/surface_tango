# One job, minimal minutes. The merge gate is `make ci` run locally; this is the last check.
# Runs only on ready PRs into main that change code, and only when BAILASAR_ACTIONS_CI is "on".
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "status/**"
      - "briefs/**"
      - "video/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.draft == false && vars.BAILASAR_ACTIONS_CI == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
      - name: Hooks on changed files
        env:
          SKIP: no-commit-to-branch,up-to-date-with-main
        run: uvx pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD
      - name: Offline tests
        run: uv run --frozen pytest -q -m "not network and not cache"
