# Operational settings (may change at any time; NOT part of the pre-registration hash).
preregistered: config/preregistered.yaml
aois:   # bboxes [W, S, E, N] in EPSG:4326 — set by the Data lane at the hour-2 gate
  1_aburra_medellin_bello: [-75.70, 6.12, -75.42, 6.45]   # Medellín, Bello, Copacabana (hour-2 gate)
  2_eje_cafetero_quake: [-75.85, 4.40, -75.40, 5.15]   # Pereira, Armenia, Manizales (hour-2 gate)
  3_la_mojana_caregato: [-75.40, 7.90, -74.20, 9.20]   # La Mojana incl. Caregato (hour-2 gate)
mcp:
  transport: sse
  ports: {nisar_asf: 8001, gee_fusion: 8002}
breaker_budgets_s:   # p95 + 0.5 s from 10 timed calls per tool (D6); default until a tool is measured
  default: 1.8
  # Owner run of mcp_servers.tool_latency (reports/tool_latency.json, 2026-11-15T09:25Z): all 10
  # calls kept (uncensored, cold call included), linear p95, budget rounded up to 0.01 s.
  # search_nisar_granules: p95 2.735 s (call 1 cold 4.32 s, others 0.30-0.79 s) -> 3.24 s.
  search_nisar_granules: 3.24
  # analyze_flood_inundation: raw cache read of local_cache/mojana/flood_evidence.json, p95 0.007 s
  # -> 0.51 s. Landslide/quake analyze_* and staging stay on `default` (not yet timeable).
  analyze_flood_inundation: 0.51
features:            # hide unfinished work behind flags instead of long-lived branches
  mathlab_corrections: false
  story_chapter_4_synthesis: false
tracing:   # LangSmith; on only when LANGSMITH_API_KEY is in .env (agents/tracing.py)
  enabled: true
  project: surface-tango
llm:   # orchestrator chain, tried in order; entries without a key in .env are skipped
  temperature: 0.0
  timeout_s: 60
  max_retries: 1
  providers:
    nebius: {base_url: "https://api.tokenfactory.nebius.com/v1", api_key_env: NEBIUS_API_KEY}  # pragma: allowlist secret
    featherless: {base_url: "https://api.featherless.ai/v1", api_key_env: FEATHERLESS_API_KEY}  # pragma: allowlist secret
    openrouter: {base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}  # pragma: allowlist secret
  chain:   # Featherless preferred; Nebius fallback; OpenRouter last (limited credits)
    - {provider: featherless, model: zai-org/GLM-5.3}                # primary
    - {provider: featherless, model: moonshotai/Kimi-K3.1-Pro}       # reasoning, same provider
    - {provider: featherless, model: zai-org/GLM-5.3-Flash}          # cheap, same provider
    - {provider: nebius, model: moonshotai/Kimi-K3.1-Pro}            # second provider
    - {provider: nebius, model: deepseek-ai/DeepSeek-V4-Pro-0813}
    - {provider: openrouter, model: moonshotai/kimi-k3.1-pro}        # last resort (limited credits)
    - {provider: openrouter, model: deepseek/deepseek-v4-pro-0813}
