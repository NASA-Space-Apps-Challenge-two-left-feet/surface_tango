# FROZEN pre-registration (design doc: Hazard 2/3, D13). Commit before viewing any C-pair coherence;
# validation/README.md records `git hash-object config/preregistered.yaml`. Never edit after freeze.
# Values below are the approved plan values; pair IDs are filled from the hour-2 gate (issue #26).
status: frozen         # frozen 2026-11-15 (#26); re-frozen after the K fix (#131, deviation 2). Hash in validation/README.md.
quake:
  # One R/C/K GUNW triplet per track over the Eje Cafetero (hour-2 gate #23 -> quake_triplets).
  # R, C and K share a track; C spans the 2026-08-10 event, R precedes C, K precedes R.
  # Design D13 asks for a 12-day baseline; the gate found C at 24 days (Aug 1/Aug 4 acquisitions
  # missing), so the closest available is used and the mismatch is recorded per triplet.
  # K shares no acquisition date with R or C (design doc, Data layer; #131). Track 11 has no
  # independent pre-event pair on frame 086, so it uses the design's post-event fallback: a
  # labelled post-event control (residual demolition/debris/aftershock change is expected), whose
  # outcome is reported as "radar vs baseline, post-event control only", never "radar beats baseline".
  pairs:
    - track: 11
      geometry: descending
      frame: 86
      reference_R: NISAR_L2_PR_GUNW_025_011_D_086_026_4000_SH_20260708T232913_20260708T232947_20260720T232912_20260720T232946_P05023_N_F_J_001
      coevent_C: NISAR_L2_PR_GUNW_026_011_D_086_028_4000_SH_20260720T232912_20260720T232946_20260813T232911_20260813T232945_P05023_N_F_J_001
      control_K: NISAR_L2_PR_GUNW_029_011_D_086_030_4000_SH_20260825T232910_20260825T232945_20260906T232910_20260906T232945_P05023_N_F_J_001
      control_K_timing: post_event   # 2026-08-25 -> 09-06; no independent pre-event pair (#131)
      baseline_days: {R: 12, C: 24, K: 12}
      baseline_mismatch: true
    - track: 47
      geometry: ascending
      frame: 4
      reference_R: NISAR_L2_PR_GUNW_025_047_A_004_026_4000_SH_20260711T103831_20260711T103906_20260723T103830_20260723T103905_P05023_N_F_J_001
      coevent_C: NISAR_L2_PR_GUNW_026_047_A_004_028_4000_SH_20260723T103830_20260723T103905_20260816T103829_20260816T103904_P05023_N_F_J_001
      control_K: NISAR_L2_PR_GUNW_023_047_A_004_024_4000_SH_20260617T103836_20260617T103907_20260629T103831_20260629T103907_P05023_N_F_J_001
      control_K_timing: pre_event    # 2026-06-17 -> 06-29; shares no date with R or C (#131)
      baseline_days: {R: 12, C: 24, K: 12}
      baseline_mismatch: true
  built_up_min_footprint_fraction: 0.50
  non_built_max_footprint_fraction: 0.10
  min_built_up_pixels_per_unit: 20
  unit: barrio
  positive_label: ">=1 damaged or collapsed building listed in the named source"
  # Uninformative: no verified barrio damage-assessment dataset was confirmed (#24 research handoff).
  # The scorecard is not produced from labels; the video headline is La Mojana (validation/README.md, #25).
  ground_truth_source:
    name: "none verified - scorecard uninformative (no confirmed barrio damage dataset for Pereira/Armenia/Manizales)"
    date: "2026-11-14"
    url: "reports/ground_truth.md"
  k_rule: {fraction: 0.10, minimum: 5}
  ranking: {access_weight: 0.25}       # score = P(DPM) * P(pop) * (1 + w * P(dist)); baseline drops P(DPM)
  informative: {min_units: 30, min_positives: 5, prevalence_min: 0.10, prevalence_max: 0.70}
  bootstrap: {unit: barrio, replicates: 2000, seed: 20261114}
flood:
  open_water_abs_hh_db: -18.0
  class1_delta_hh_db_max: -5.5
  class2_delta_hh_db_min: 3.0
  class2_delta_hv_hh_db_abs_max: 1.5
  hand_max_m: 18
  no_baseline_relative_gap: 0.20
  sensitivity: {db_step: 1.0, hand_m: [12, 18, 24]}
landslide:
  # Honesty test (design doc, Hazard 1): keep a velocity only where |rate| > stable-pixel
  # residual RMS in every pair AND the sign agrees across two independent pairs.
  noise_floor: {min_pairs: 2, require_sign_agreement: true}
labels: {uncalibrated: [open_water_abs_hh_db, class1_delta_hh_db_max, class2_delta_hh_db_min, class2_delta_hv_hh_db_abs_max, hand_max_m]}
